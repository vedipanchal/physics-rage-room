<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turbine Health Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Turbine Health Monitor</h1>
      <p>Enter turbine telemetry to assess current operating condition.</p>
    </header>

    <section class="monitor" aria-label="Turbine health controls and status">
      <form id="health-form" novalidate>
        <label class="field" for="temperature">
          <span>Temperature (°C)</span>
          <input id="temperature" name="temperature" type="number" inputmode="decimal" min="0" placeholder="e.g. 95" required />
        </label>

        <label class="field" for="vibration">
          <span>Vibration (mm/s)</span>
          <input id="vibration" name="vibration" type="number" inputmode="decimal" min="0" step="0.1" placeholder="e.g. 5.2" required />
        </label>

        <label class="field" for="rpm">
          <span>RPM</span>
          <input id="rpm" name="rpm" type="number" inputmode="numeric" min="0" placeholder="e.g. 1800" required />
        </label>

        <button type="submit" class="btn">Analyze Condition</button>
      </form>

      <section id="result" class="result safe" aria-live="polite">
        <h2 id="status-title">SAFE: Normal Operation</h2>
        <p id="status-message">System is stable. Continue routine monitoring and scheduled maintenance.</p>
      </section>
    </section>

    <section class="visual" aria-label="3D turbine model visualization">
      <div class="visual__header">
        <h2>3D Turbine View</h2>
        <p>Drag to rotate, pinch/scroll to zoom.</p>
      </div>
      <div id="turbine-canvas" class="canvas-wrap" role="img" aria-label="Interactive 3D model of a turbine"></div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
